# Active Netlify configuration. The site's base directory is the repository root,
# so this file is read and src/app/netlify.toml is not.
# Hashed-asset Cache-Control rules are generated per file into dist/_headers by
# scripts/netlify-hashed-asset-headers.mjs; do not add Cache-Control here.

[build]
  command = "npm run build"
  # Directory with the static files to deploy
  publish = "dist"

# Production environment variables — standardized for development, CI/CD, and Netlify
[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "10"

# Baseline security headers. Content-Security-Policy is deliberately deferred:
# the draft policy in src/app/netlify.toml would block the Typeform, YouTube and Vimeo embeds.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# HTML revalidation for SPA entry points. Browser must check for updates on every request.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Reader-access API routes. Functions must be served before the SPA fallback.
# Phase 6 (Content Delivery) endpoints must be routed explicitly before the wildcard.
# Pattern: /api/reader/* routes → netlify/functions/

# Phase 6: Chapter listing
[[redirects]]
  from = "/api/reader/chapters"
  to = "/.netlify/functions/reader-chapters-list"
  status = 200

# Phase 6: Chapter content delivery
[[redirects]]
  from = "/api/reader/chapters/*"
  to = "/.netlify/functions/reader-chapter-content/:splat"
  status = 200

# Phase 6: Reading progress
[[redirects]]
  from = "/api/reader/progress"
  to = "/.netlify/functions/reader-progress"
  status = 200

# Phase 6: Analytics
[[redirects]]
  from = "/api/reader/analytics"
  to = "/.netlify/functions/reader-analytics"
  status = 200

# Phase 6: Bookmarks
[[redirects]]
  from = "/api/reader/bookmarks"
  to = "/.netlify/functions/reader-bookmarks"
  status = 200

# Earlier phases (code-request, verification, session)
[[redirects]]
  from = "/api/reader/*"
  to = "/.netlify/functions/reader-:splat"
  status = 200

# Never serve source maps. Backstop for Sentry's post-upload cleanup
# (vite.config.ts) in case it doesn't run, e.g. a build without
# SENTRY_AUTH_TOKEN. Edge functions run before redirects and static files.
[[edge_functions]]
  function = "deny-source-maps"
  pattern = "^/.*\\.map$"

# SPA fallback for React Router. Defined in both netlify.toml and public/_redirects
# for deployment consistency across different hosting scenarios.
# This redirect applies AFTER function routes, so /api/reader/* are not affected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimize images
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
