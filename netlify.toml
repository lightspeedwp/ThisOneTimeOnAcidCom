# Active Netlify configuration. The site's base directory is the repository root,
# so this file is read and src/app/netlify.toml is not.
# Hashed-asset Cache-Control rules are generated per file into dist/_headers by
# scripts/netlify-hashed-asset-headers.mjs; do not add Cache-Control here.

[build]
  command = "npm run build"
  # Directory with the static files to deploy
  publish = "dist"

# Production environment variables — standardized for development, CI/CD, and Netlify
[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "10"

# Baseline security headers. Content-Security-Policy is deliberately deferred:
# the draft policy in src/app/netlify.toml would block the Typeform, YouTube and Vimeo embeds.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# HTML revalidation for SPA entry points. Browser must check for updates on every request.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback for React Router. Not forced, so existing files are served as-is.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimize images
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
