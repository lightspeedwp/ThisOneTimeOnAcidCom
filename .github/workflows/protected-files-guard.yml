name: Protected Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-protected-files:
    name: Check Protected Files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for protected file modifications
        id: protected_check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Get list of changed files in the PR
          # Use --no-renames to detect both old and new paths on file renames
          # This prevents renamed protected files from bypassing the guard
          CHANGED_FILES=$(git diff --name-only --no-renames origin/"${BASE_REF}"...HEAD)

          # Define protected file patterns (from .github/PROTECTED_FILES.txt)
          # Patterns are extended regular expressions with proper escaping
          PROTECTED_PATTERNS=(
            "^\.github/"
            "^scripts/"
            "^AGENTS\.md$"
            "^CHANGELOG\.md$"
            "^ATTRIBUTIONS\.md$"
            "^guidelines/"
            "^src/app/utils/supabase/"
            "^src/app/components/figma/ImageWithFallback\.tsx$"
            "^tasks/task-list\.md$"
          )

          PROTECTED_MODIFIED=()

          # Check each changed file against protected patterns
          for file in $CHANGED_FILES; do
            for pattern in "${PROTECTED_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then
                PROTECTED_MODIFIED+=("$file")
                break
              fi
            done
          done

          # Report findings
          if [ ${#PROTECTED_MODIFIED[@]} -gt 0 ]; then
            echo "protected_files_found=true" >> $GITHUB_OUTPUT
            echo "PROTECTED_MODIFIED<<EOF" >> $GITHUB_OUTPUT
            printf '%s\n' "${PROTECTED_MODIFIED[@]}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "protected_files_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR if protected files detected
        if: steps.protected_check.outputs.protected_files_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const protectedFiles = `${{ steps.protected_check.outputs.PROTECTED_MODIFIED }}`.split('\n').filter(f => f);

            const comment = `⚠️ **Protected Files Modified**

            This pull request modifies one or more protected files that require explicit owner review and approval.

            **Protected files detected:**
            ${protectedFiles.map(f => `- \`${f}\``).join('\n')}

            **Protected file categories:**
            - \`.github/\` — Governance, workflows, labels, issue types, templates
            - \`scripts/\` — Build and validation scripts
            - \`AGENTS.md\` — AI agent rules and governance
            - \`CHANGELOG.md\` — Release history (managed by Release Agent)
            - \`ATTRIBUTIONS.md\` — Project attributions
            - \`guidelines/\` — CSS architecture, coding standards
            - \`src/app/utils/supabase/\` — Backend integration (protected from changes)
            - \`src/app/components/figma/ImageWithFallback.tsx\` — Figma integration component
            - \`tasks/task-list.md\` — Task tracker (never delete)

            **Required action:**
            1. Open an issue on the \`lightspeedwp/.github\` repository with \`[PROTECTED-FILE-CHANGE-REQUEST]\` tag
            2. Describe why these protected files need modification
            3. Wait for @ashley approval before proceeding

            See [AGENTS.md § Protected and locked files](../../AGENTS.md#protected-and-locked-files) for details.`;

            try {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              // Handle fork PRs that don't have write permissions
              core.warning(`Failed to post comment: ${error.message}. This may be expected for fork PRs.`);
            }

      - name: Fail check if protected files modified
        if: steps.protected_check.outputs.protected_files_found == 'true'
        run: |
          echo "❌ Protected files were modified. This requires explicit owner approval."
          echo ""
          echo "Protected files detected:"
          echo "${{ steps.protected_check.outputs.PROTECTED_MODIFIED }}"
          exit 1

      - name: Pass check if no protected files modified
        if: steps.protected_check.outputs.protected_files_found == 'false'
        run: |
          echo "✅ No protected files were modified."
          echo ""
          echo "This PR is clear of protected file modifications and may proceed."
