name: Protected Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-protected-files:
    name: Check Protected Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      issues: read
      contents: read

    steps:
      # Read metadata only; never check out or execute pull request code.
      - name: Check protected files and approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            if (pr.changed_files > files.length) {
              core.setFailed('Cannot verify an incomplete changed-file list.');
              return;
            }

            // Include both sides of renames. Keep these patterns aligned with PROTECTED_FILES.txt.
            const patterns = [
              /^\.github\//, /^scripts\//, /^AGENTS\.md$/, /^CHANGELOG\.md$/,
              /^ATTRIBUTIONS\.md$/, /^guidelines\//, /^src\/app\/utils\/supabase\//,
              /^src\/app\/components\/figma\/ImageWithFallback\.tsx$/, /^tasks\/task-list\.md$/,
            ];
            const changedPaths = files.flatMap(file =>
              file.previous_filename ? [file.filename, file.previous_filename] : [file.filename]
            );
            const protectedFiles = [...new Set(changedPaths.filter(file => patterns.some(pattern => pattern.test(file))))];
            if (protectedFiles.length === 0) {
              core.info('No protected files were modified.');
              return;
            }

            // CODEOWNERS uses @ashley; @ashleyshaw is the owner's GitHub account.
            const owners = new Set(['ashley', 'ashleyshaw']);
            const isApproval = text => /^(?:I approve\b|Approved(?:[.!]|\s|$))/im.test(text || '');
            const references = [...new Set(Array.from((pr.body || '').matchAll(
              /https:\/\/github\.com\/lightspeedwp\/\.github\/issues\/([1-9]\d*)(?=$|[\s)#?])/g
            ), match => Number(match[1])))];
            const approvedFiles = new Set();

            for (const issue_number of references) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: 'lightspeedwp', repo: '.github', issue_number,
                });
                if (issue.pull_request || !issue.title.includes('[PROTECTED-FILE-CHANGE-REQUEST]')) continue;
                const body = issue.body || '';
                const prLinks = Array.from(body.matchAll(
                  /https:\/\/github\.com\/([^\s/]+)\/([^\s/]+)\/pull\/([1-9]\d*)(?=$|[\s)#?])/g
                ));
                if (!prLinks.some(link => link[1] === context.repo.owner &&
                  link[2] === context.repo.repo && Number(link[3]) === pr.number)) continue;

                let approved = owners.has(issue.user.login) && isApproval(body);
                if (!approved) {
                  const comments = await github.paginate(github.rest.issues.listComments, {
                    owner: 'lightspeedwp', repo: '.github', issue_number, per_page: 100,
                  });
                  // An approval must postdate the issue's last scope edit.
                  approved = comments.some(comment => owners.has(comment.user.login) &&
                    isApproval(comment.body) && Date.parse(comment.created_at) >= Date.parse(issue.updated_at));
                }
                if (!approved) continue;

                // Exact code/bold paths, or a directory plus named basenames.
                // A directory alone never grants approval to every file below it.
                const paths = Array.from(body.matchAll(/`([^`\n]+)`|\*\*([^*\n]+)\*\*/g), match => {
                  const path = match[1] || match[2];
                  return path.startsWith(context.repo.repo + '/') ? path.slice(context.repo.repo.length + 1) : path;
                });
                const directories = paths.filter(path => path.endsWith('/'));
                const scope = new Set(paths.filter(path => !path.endsWith('/')));
                for (const directory of directories) {
                  for (const name of paths.filter(path => !path.includes('/'))) scope.add(directory + name);
                }
                for (const file of protectedFiles) {
                  if (scope.has(file)) approvedFiles.add(file);
                }
                core.info(`Checked approval: ${issue.html_url}`);
              } catch (error) {
                core.warning(`Could not verify lightspeedwp/.github#${issue_number}: ${error.message}`);
              }
            }

            const unapproved = protectedFiles.filter(file => !approvedFiles.has(file));
            if (unapproved.length > 0) {
              core.setFailed('Owner approval required for: ' + unapproved.join(', ') +
                '. Link a [PROTECTED-FILE-CHANGE-REQUEST] issue in lightspeedwp/.github ' +
                'that names this PR and every protected path, and records owner approval.');
              return;
            }
            core.info('Owner approval verified for all modified protected files.');
