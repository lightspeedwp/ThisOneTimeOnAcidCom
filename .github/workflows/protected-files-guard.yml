name: Protected Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-protected-files:
    name: Check Protected Files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for protected file modifications
        id: protected_check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Keep filenames intact, including whitespace, and detect renamed paths.
          CHANGED_FILES=$(mktemp)
          trap 'rm -f "$CHANGED_FILES"' EXIT
          git diff --no-renames --name-only -z "origin/$BASE_REF...HEAD" -- > "$CHANGED_FILES"

          # Exact filenames and directory prefixes (with a trailing slash).
          PROTECTED_PATTERNS=(
            "AGENTS.md"
            "CHANGELOG.md"
            "ATTRIBUTIONS.md"
            "guidelines/"
            "scripts/"
            "src/app/components/figma/ImageWithFallback.tsx"
            "src/app/utils/supabase/"
            ".github/workflows/"
            "tasks/task-list.md"
          )

          PROTECTED_MODIFIED=()

          while IFS= read -r -d '' file; do
            for pattern in "${PROTECTED_PATTERNS[@]}"; do
              if [[ "$file" == "$pattern" || ( "$pattern" == */ && "$file" == "$pattern"* ) ]]; then
                PROTECTED_MODIFIED+=("$file")
                break
              fi
            done
          done < "$CHANGED_FILES"

          # JSON is a data-only output, even for filenames containing newlines.
          PROTECTED_JSON=$(node -e 'process.stdout.write(JSON.stringify(process.argv.slice(1)))' -- "${PROTECTED_MODIFIED[@]}")
          printf 'PROTECTED_MODIFIED=%s\n' "$PROTECTED_JSON" >> "$GITHUB_OUTPUT"
          if [ ${#PROTECTED_MODIFIED[@]} -gt 0 ]; then
            echo "protected_files_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected_files_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize protected files requiring owner review
        if: steps.protected_check.outputs.protected_files_found == 'true'
        uses: actions/github-script@v7
        env:
          PROTECTED_MODIFIED: ${{ steps.protected_check.outputs.PROTECTED_MODIFIED }}
        with:
          script: |
            const protectedFiles = JSON.parse(process.env.PROTECTED_MODIFIED);
            const escapeHtml = value => value
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');

            await core.summary
              .addHeading('Protected files modified', 2)
              .addRaw('These files require explicit owner review and approval.\n\n')
              .addList(protectedFiles.map(file => `<code>${escapeHtml(file)}</code>`))
              .addRaw('This check reports detection. Branch protection must require code owner review using .github/CODEOWNERS to enforce approval.\n')
              .write();

      - name: Pass check if no protected files modified
        if: steps.protected_check.outputs.protected_files_found == 'false'
        run: |
          echo "✅ No protected files were modified."
          echo ""
          echo "This PR is clear of protected file modifications and may proceed."
