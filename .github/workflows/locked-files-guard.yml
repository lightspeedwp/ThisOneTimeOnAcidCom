name: Locked Files Guard

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'guidelines/**'
      - '.github/labels.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'guidelines/**'
      - '.github/labels.yml'

jobs:
  check-protected-files:
    name: Check Protected Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect protected file changes
        id: check
        run: |
          # List of protected files/paths
          PROTECTED_PATHS=(
            ".github/workflows/"
            "CHANGELOG.md"
            "AGENTS.md"
            "guidelines/"
            ".github/labels.yml"
          )

          CHANGED_PROTECTED=()

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Get files changed in PR
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # Get files changed in push (compared to previous commit)
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }})
            else
              # New branch - compare with master/main
              CHANGED_FILES=$(git diff --name-only HEAD~1...HEAD 2>/dev/null || echo "")
            fi
          fi

          # Check if any changed files are protected
          for protected_path in "${PROTECTED_PATHS[@]}"; do
            while IFS= read -r changed_file; do
              if [[ "$changed_file" == "$protected_path"* ]] || [[ "$changed_file" == "$protected_path" ]]; then
                CHANGED_PROTECTED+=("$changed_file")
              fi
            done <<< "$CHANGED_FILES"
          done

          if [ ${#CHANGED_PROTECTED[@]} -gt 0 ]; then
            echo "found_protected=true" >> $GITHUB_OUTPUT
            # Store protected files for comment
            printf '%s\n' "${CHANGED_PROTECTED[@]}" > /tmp/protected_files.txt
            cat /tmp/protected_files.txt
          else
            echo "found_protected=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR (protected files modified)
        if: github.event_name == 'pull_request' && steps.check.outputs.found_protected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readFileSync('/tmp/protected_files.txt', 'utf8').trim().split('\n');

            const fileList = files.map(f => `- \`${f}\``).join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ This PR modifies protected governance files:\n\n${fileList}\n\nThese files require approval from a CODEOWNERS reviewer (@ashley) before merging. Please ensure you have obtained necessary approval.`
            });

      - name: Block merge if protected files modified
        if: steps.check.outputs.found_protected == 'true'
        run: |
          echo "::error::Cannot merge: protected governance files have been modified. Requires CODEOWNERS approval."
          exit 1
