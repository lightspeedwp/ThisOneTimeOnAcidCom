name: Tests

# Runs the Vitest suite on every PR and fails only on failures the PR
# introduces: develop still carries known failures (#3472), so the head and
# base are tested in parallel and compared. Once #3472 clears the baseline,
# this can gate on zero failures instead (#3479).

on:
  # No paths filter: this backs a status check, and a filtered-out run
  # never reports.
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout changed files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$RUNNER_TEMP/tests-changed-files"
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$changed_files"
            if [ -s "$changed_files" ]; then
              docs_only=true
              while IFS= read -r -d '' file; do
                case "$file" in
                  docs/LABEL_STRATEGY.md | docs/LABELING.md)
                    docs_only=false
                    break
                    ;;
                  docs/*.md) ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done < "$changed_files"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  vitest:
    name: Vitest (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [head, base]
        exclude:
          # No base to compare against outside a pull request.
          - target: ${{ github.event_name != 'pull_request' && 'base' || 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          # head: the PR merge commit (default); base: the PR base commit.
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests (Jest on base, Vitest on head during cutover)
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ matrix.target }}
        run: |
          # During Jest-to-Vitest cutover: base contains jest.mock() calls,
          # head contains vi.* mocks. Use Jest baseline to ensure head comparison
          # is valid. Once base catches up, simplify to Vitest everywhere.
          test_status=0

          if [ "$TARGET" = "base" ]; then
            # Base revision still has jest.mock() — must run Jest
            npx jest --config jest.config.js --ci --json --outputFile=jest-report.json || test_status=$?
          else
            # Head revision has vi.* mocks — run Vitest
            npx vitest run --reporter=json --outputFile=jest-report.json --coverage=false || test_status=$?
          fi

          # Report summary and detect empty suites
          num_suites=$(jq '.numTotalTestSuites // (.testResults | length)' jest-report.json 2>/dev/null || echo 0)
          num_failed=$(jq '.numFailedTests // 0' jest-report.json 2>/dev/null || echo 0)
          echo "Test summary: suites=${num_suites} failed=${num_failed}"

          # Fail if:
          # 1. Test runner crashed ($test_status != 0) AND
          #    - Explicit failure requested (workflow_dispatch), OR
          #    - No report generated, OR
          #    - Suite discovered no tests
          if [ "$test_status" -ne 0 ] && { [ "$EVENT_NAME" = "workflow_dispatch" ] || [ ! -s jest-report.json ] || [ "$num_suites" -eq 0 ]; }; then
            echo "::error::Test runner failed or no tests discovered"
            exit 1
          fi

      - name: Check the suite left the working tree clean
        run: |
          # Tests must not write into the repository (#3482). Warning only
          # until that is fixed.
          dirty=$(git status --porcelain -- . ':!jest-report.json')
          if [ -n "$dirty" ]; then
            echo "::warning::Vitest modified the working tree (#3482):"
            printf '%s\n' "$dirty"
          fi

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report-${{ matrix.target }}
          path: jest-report.json
          if-no-files-found: ignore
          retention-days: 7

  compare:
    name: No new test failures
    needs: [scope, vitest]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report documentation-only skip
        if: needs.scope.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only pull request; Vitest comparison skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout comparison script
        if: needs.scope.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/validation

      - name: Download reports
        if: needs.scope.outputs.docs_only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-report-*
          path: reports

      - name: Compare head with base
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          set -o pipefail
          for target in head base; do
            if ! jq -e '.testResults | type == "array"' "reports/vitest-report-$target/jest-report.json" >/dev/null 2>&1; then
              echo "::error::Missing or invalid Vitest report for $target; failing closed."
              exit 1
            fi
          done
          # Both jobs check out to the same workspace path, so one root
          # makes their test paths comparable. The default shell is
          # bash -e: suspend errexit so a non-zero result still reaches the
          # summary below.
          set +e
          node scripts/validation/compare-jest-failures.cjs \
            --head reports/vitest-report-head/jest-report.json --head-root "$GITHUB_WORKSPACE" \
            --base reports/vitest-report-base/jest-report.json --base-root "$GITHUB_WORKSPACE" \
            | tee comparison.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Test comparison (head vs base)"
            echo
            echo '```'
            cat comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
