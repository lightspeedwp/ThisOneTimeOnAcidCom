version: 2

# DEPRECATED: Dependabot has been replaced by Renovate.
#
# This file is retained for reference only. Renovate configuration is now
# managed in .github/renovate.json, which extends the canonical configuration
# from lightspeedwp/.github/renovate.json.
#
# Migration completed: 2026-11-09
# See: https://github.com/lightspeedwp/ThisOneTimeOnAcidCom/issues/TOA-451
#
# Dependabot has been disabled below. No further updates are created.

updates: []
  # GitHub Actions — minor and patch grouped; major separate, daily
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: daily
      time: "03:00"
      timezone: Africa/Johannesburg
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - area:dependencies
      - area:ci

  # npm dependencies — minor and patch grouped; major separate, weekly (Monday)
  # Requires confirmation that npm is the authoritative package manager.
  # See AGENTS.md "Unresolved decisions" and issue #306 for context.
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Africa/Johannesburg
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - area:dependencies

# Security updates
#
# GitHub's default behaviour: all security updates are created for the
# repository's default branch, regardless of target-branch configuration above.
# The repository's current default branch is 'develop'.
#
# Current expected behaviour:
# - Version updates → target-branch: develop (configured above)
# - Security updates → develop (GitHub automatic, targets default branch)
