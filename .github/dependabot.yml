version: 2

# Dependabot configuration for ThisOneTimeOnAcidCom
#
# NOTE: npm configuration is contingent on resolving the package-manager
# conflict documented in AGENTS.md (Unresolved decision #1). README recommends
# pnpm, but CONTRIBUTING.md, AGENTS.md and Netlify build command use npm.
# See https://github.com/lightspeedwp/ThisOneTimeOnAcidCom/issues/306#L1
#
# If pnpm is confirmed as authoritative, replace the npm section below with:
#
#   - package-ecosystem: pnpm
#     directory: "/"
#     target-branch: develop
#     schedule:
#       interval: weekly
#       day: monday
#       time: "03:00"
#       timezone: Africa/Johannesburg
#     groups:
#       pnpm-minor-patch:
#         update-types:
#           - minor
#           - patch
#     open-pull-requests-limit: 10
#     labels:
#       - area:dependencies
#

updates:
  # GitHub Actions — minor and patch only, daily
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: daily
      time: "03:00"
      timezone: Africa/Johannesburg
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - area:dependencies
      - area:ci

  # npm dependencies — minor and patch only, weekly (Monday)
  # Requires confirmation that npm is the authoritative package manager.
  # See AGENTS.md "Unresolved decisions" and issue #306 for context.
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Africa/Johannesburg
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - area:dependencies

# Security updates
#
# GitHub's default behaviour: all security updates are created for the
# repository's default branch (currently 'main'), regardless of target-branch.
# If you need security updates to target 'develop' instead, file a separate
# GitHub support request.
#
# Current expected behaviour:
# - Version updates → target-branch: develop (configured above)
# - Security updates → main (GitHub default, not configurable here)
