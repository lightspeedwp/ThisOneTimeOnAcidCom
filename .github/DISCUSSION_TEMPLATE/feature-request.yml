labels: ['type:feature', 'status:needs-triage']
title: "[Feature request] "
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new feature or improvement for ThisOneTimeOnAcidCom.
  - type: textarea
    id: description
    attributes:
      label: "Describe your feature request"
      description: "What would you like to see improved or added?"
      placeholder: "It would be great if we could..."
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: "Use case"
      description: "How would this benefit users or the project?"
      placeholder: "This would help with..."
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives you've considered"
      description: "Are there other ways to solve this problem?"
      placeholder: "Other approaches might include..."
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checks"
      options:
        - label: "I've searched existing discussions and issues"
          required: true
