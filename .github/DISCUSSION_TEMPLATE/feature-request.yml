title: Feature Request
labels: [feature-request]
body:
  - type: markdown
    attributes:
      value: |
        # Feature Request

        Thank you for suggesting an enhancement! Please provide details about your feature request so we can understand your needs.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the feature you'd like to see. What problem does it solve? How would it improve the project?
      placeholder: |
        I'd like to see... because...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the specific use case or scenario where this feature would be helpful.
      placeholder: |
        In my project, I need to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives or workarounds have you considered?
      placeholder: |
        I could use... but...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples here.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgments
      options:
        - label: I have searched for existing feature requests that might cover this
          required: true
        - label: I understand this is a community discussion and may take time to review
          required: true
