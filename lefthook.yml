# Lefthook configuration for ThisOneTimeOnAcid
# Runs local Git hooks to catch issues before they reach remote

min_version: 1.5.3

# Pre-commit: validate branch naming and journal markdown
# Runs validations and logs errors without blocking commits
pre-commit:
  parallel: false
  commands:
    validate-all:
      run: bash scripts/hooks/validate-with-logging.sh
      skip:
        - merge
        - rebase

# Pre-push: validate branch naming and build verification before pushing to remote
# Logs errors without blocking push to allow Figma Make and automation to proceed
pre-push:
  parallel: false
  commands:
    push-validate-all:
      run: bash scripts/hooks/validate-push-with-logging.sh
      use_stdin: true
      skip:
        - merge
        - rebase
