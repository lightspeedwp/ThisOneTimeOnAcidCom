<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-pink" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF10F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F0F0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-yellow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4FF3C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F0F0F" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F0F0F"/>
  <rect width="1200" height="630" fill="url(#glow-pink)"/>
  <rect width="1200" height="630" fill="url(#glow-yellow)"/>

  <!-- Grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#FF10F0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#FF10F0" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Name — neon pink -->
  <text x="100" y="260" font-family="'Space Grotesk', Righteous, sans-serif" font-size="100" font-weight="700" fill="#FF10F0" filter="url(#neon-glow)" letter-spacing="-2">ASH SHAW</text>
  <text x="100" y="260" font-family="'Space Grotesk', Righteous, sans-serif" font-size="100" font-weight="700" fill="#FF10F0" letter-spacing="-2">ASH SHAW</text>

  <!-- Subtitle — neon yellow -->
  <text x="102" y="330" font-family="'Space Grotesk', Righteous, sans-serif" font-size="32" font-weight="400" fill="#F4FF3C" letter-spacing="4">NEON &amp; UV MAKEUP ART</text>

  <!-- Divider -->
  <rect x="100" y="356" width="520" height="2" fill="#FF10F0" opacity="0.6"/>

  <!-- Tagline -->
  <text x="102" y="400" font-family="'Inter', sans-serif" font-size="22" fill="#F6F2EB" opacity="0.7" letter-spacing="1">Festival Face Paint · Blacklight Designs · Berlin</text>

  <!-- URL -->
  <text x="102" y="470" font-family="'Space Grotesk', monospace" font-size="18" fill="#FF10F0" opacity="0.5" letter-spacing="2">ashshaw.com</text>

  <!-- Neon dot accent top right -->
  <circle cx="1100" cy="315" r="80" fill="none" stroke="#FF10F0" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="315" r="40" fill="none" stroke="#F4FF3C" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="315" r="8" fill="#FF10F0" opacity="0.8"/>
</svg>
