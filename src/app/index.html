    <!-- FOUC Prevention Script — Defaults to Dark Mode -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          // Default to dark mode (neon pink/yellow design)
          var theme = savedTheme || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Fallback to dark mode on error
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Error Suppression Script - Must run before any other scripts -->
    <script>
      (function() {
        // Patterns to suppress (browser extensions + esm.sh Node polyfill shims)
        function isSuppressible(msg, src) {
          return (
            msg.indexOf('async_hooks') !== -1 ||
            msg.indexOf('esm.sh/node/') !== -1 ||
            (src && src.indexOf('async_hooks') !== -1) ||
            (src && src.indexOf('esm.sh/node/') !== -1)
          );
        }

        // Global error handler
        window.onerror = function(msg, url, line, col, error) {
          var message = String(msg);
          var source = String(url || '');
          var stack = (error && error.stack) ? error.stack : '';
          if (
            isSuppressible(message, source) ||
            isSuppressible(stack, source)
          ) {
            return true; // Suppress error
          }
          return false;
        };

        // Error event listener (capture phase — fires before anything else)
        window.addEventListener('error', function(event) {
          var message = event.message || '';
          var filename = event.filename || '';
          var stack = (event.error && event.error.stack) ? event.error.stack : '';
          if (
            isSuppressible(message, filename) ||
            isSuppressible(stack, filename)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Unhandled rejection handler
        window.addEventListener('unhandledrejection', function(event) {
          var message = event.reason ? (event.reason.message || String(event.reason)) : '';
          var stack = (event.reason && event.reason.stack) ? event.reason.stack : '';
          if (
            isSuppressible(message, '') ||
            isSuppressible(stack, '')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // Console error override
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.from(arguments);
          var message = args.map(function(arg) {
            return (arg instanceof Error) ? (arg.message + (arg.stack || '')) : String(arg);
          }).join(' ');

          if (isSuppressible(message, '')) {
            return;
          }
          originalConsoleError.apply(console, args);
        };
      })();
    </script>
