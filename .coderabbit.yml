# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

language: en-GB

reviews:
  profile: chill
  path_instructions:
    - path: ".claude/**/*.md"
      instructions: |
        These are Claude Code configuration and skill definitions. Review for:
        - Skill frontmatter metadata (name, description, trigger conditions)
        - Proper linking between skills and their usage patterns
        - Accurate descriptions of tool dependencies and permissions
        - Consistency with AGENTS.md repository conventions
        - No hardcoded credentials or sensitive data in skill definitions
        - Clear examples and use cases for each skill/agent

    - path: ".claude/agents/**/*"
      instructions: |
        Claude Code agent specifications and configurations. Review for:
        - Valid agent type names and proper parameter definitions
        - Clear prompt instructions that align with repository conventions
        - Tool access specifications and permission requirements
        - Agent role declarations matching AGENTS.md conventions
        - No over-scoping of agent capabilities beyond their intended use case

    - path: ".claude/skills/**/*.md"
      instructions: |
        Claude Code reusable skills (SKILL.md files). Review for:
        - Proper SKILL.md structure with overview, commands, and examples
        - Frontmatter metadata with name, description and trigger keywords
        - Clear usage examples showing the skill in action
        - Accurate tool and permission documentation
        - Links to related skills and integration points
        - Consistency with repository-specific conventions (paths, naming, workflow)

    - path: ".specify/**/*"
      instructions: |
        Spec Kit specification files and templates. Review for:
        - Proper YAML/markdown frontmatter in specification files
        - Clear structure following the spec numbering scheme (.github/specs/)
        - Links to related specifications and dependencies
        - Complete sections: Overview, Requirements, Success Criteria, Implementation Plan
        - No broken links to guidelines or other specifications

    - path: ".gemini/**/*"
      instructions: |
        Gemini CLI command definitions and workflows. Review for:
        - Valid command structure and parameter definitions
        - Clear descriptions of command purpose and usage
        - Proper integration with Claude Code workflows
        - No duplication with existing .claude/skills/ definitions
        - Consistency with Spec Kit phases and orchestration

    - path: "AGENTS.md"
      instructions: |
        Repository-wide AI agent conventions and protected files. Critical governance document.
        Review for:
        - Accurate tech stack inventory matching package.json
        - Up-to-date bundler compatibility rules and forbidden patterns
        - Protected file list correctness (never modify without owner confirmation)
        - Folder conventions alignment with actual directory structure
        - Valid script commands that exist in package.json
        - No stale unresolved decisions or outdated constraints
        - Links to guidelines/ and other documentation are current
        This file governs all AI work in the repository — treat changes as high-priority review.

    - path: "CLAUDE.md"
      instructions: |
        Organisation-wide AI rules for lightspeedwp/.github. Sets governance policy.
        Review for:
        - Branch naming pattern conformance (no forbidden prefixes: claude/, copilot/, openai/)
        - PR template routing rules and label taxonomy correctness
        - Specification-first workflow compliance (SpecKit integration)
        - Protected configuration files (labels.yml, issue-types.yml, templates) — never edit
        - Changelog format consistency (Keep a Changelog 1.1.0)
        - Reference to AGENTS.md and linked governance documents
        - Alignment with actual repository structure and automation
        This is the source of truth for governance — verify all claims against implementation.

    - path: "tests/**/*.{ts,tsx,mjs}"
      instructions: |
        Test files and test infrastructure. Review for:
        - Proper test framework usage (Node test runner per AGENTS.md)
        - Clear test naming that describes what is being tested (descriptive case names)
        - Proper setup and teardown (avoid side effects, use isolated test data)
        - Alignment with Figma Make bundler compatibility (no forbidden patterns in tests)
        - Mock data sourced from src/app/data/mock/ only (never hardcode test data)
        - No flaky or non-deterministic tests (use fixtures, not live data)
        - Test coverage for critical paths and accessibility requirements
        - Clear documentation of test purpose and special setup requirements
        - No use of jsdom for unit tests unless explicitly required
        - Tests that run independently without order dependencies

    - path: "**/*.test.{ts,tsx}"
      instructions: |
        Component and unit tests. Review for:
        - Clear test descriptions using Arrange-Act-Assert pattern
        - Proper mocking of external dependencies (data, API calls, browser APIs)
        - Accessibility testing where relevant (keyboard nav, ARIA attributes)
        - Mock data from src/app/data/mock/ only
        - No tests that depend on execution order
        - Clear assertions that test one thing per test case
        - Performance considerations for component rendering tests

    - path: "**/*.{tsx,ts,jsx,js,css}"
      instructions: |
        Follow the guidelines in `guidelines/Guidelines.md` for code style,
        file structure, and project conventions. Read AGENTS.md for repository-specific
        conventions and protected files.
        Ensure accessibility (a11y) best practices are followed throughout the application.
        Verify that mock data is sourced exclusively from `src/app/data/mock/` (mapped from
        `/data/mock/` in guidelines).
        Validate that the project-specific bundler configuration supports the implemented features.
        For CSS, adhere to semantic BEM naming conventions and flag the usage of Tailwind
        utility classes or inline styles.
        Maintain consistency with the existing codebase, particularly in component architecture
        and state management.
