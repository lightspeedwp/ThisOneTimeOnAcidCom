# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

language: en-GB

reviews:
  profile: chill
  path_instructions:
    - path: "**/*.{tsx,ts,jsx,js,css}"
      instructions: |
        Follow the guidelines in `guidelines/Guidelines.md` for code style,
        file structure, and project conventions. Read AGENTS.md for repository-specific
        conventions and protected files.
        Ensure accessibility (a11y) best practices are followed throughout the application.
        Verify that mock data is sourced exclusively from `src/app/data/mock/` (mapped from
        `/data/mock/` in guidelines).
        Validate that the project-specific bundler configuration supports the implemented features.
        For CSS, adhere to semantic BEM naming conventions and flag the usage of Tailwind
        utility classes or inline styles.
        Maintain consistency with the existing codebase, particularly in component architecture
        and state management.
