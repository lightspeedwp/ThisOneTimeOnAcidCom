# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-GB

reviews:
  profile: chill
  path_instructions:
    - path: "**/*.{tsx,ts,css}"
      instructions: |
        Follow the guidelines in `guidelines/Guidelines.md` for code style,
        file structure, and project conventions.
        Ensure accessibility (a11y) best practices are followed throughout the application.
        Verify that mock data is sourced exclusively from `src/mockData/`.
        Validate that the project-specific bundler configuration supports the implemented features.
        For CSS, adhere to semantic BEM naming conventions and flag the usage of Tailwind utility classes or inline styles.
        Maintain consistency with the existing codebase, particularly in component architecture and state management.
